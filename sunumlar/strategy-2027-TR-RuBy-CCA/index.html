<style>
  /* Renkler Signify kurumsal sablonundan: #00E487, #1ECBD0, #1432FF, #3C3C41 */
  :root { --green:#00E487; --teal:#1ECBD0; --blue:#1432FF; --ink:#0B0B0E; --grad:linear-gradient(120deg,#00E487,#1ECBD0); --ease:cubic-bezier(.2,.7,.1,1); }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    min-height: 100vh; min-height: 100svh;
    font-family: "Inter", "Segoe UI", system-ui, sans-serif; color: #fff; background: var(--ink);
    display: flex; align-items: center; justify-content: center; overflow: hidden;
    padding: calc(env(safe-area-inset-top, 0px) + 24px) 20px calc(env(safe-area-inset-bottom, 0px) + 24px);
    -webkit-font-smoothing: antialiased;
  }
  .hidden { display: none !important; }
  .bg { position: fixed; inset: 0; pointer-events: none; overflow: hidden; }
  .orb { position: absolute; border-radius: 50%; filter: blur(60px); opacity: .5; animation: float 18s ease-in-out infinite alternate; }
  .orb.a { width: 70vmax; height: 70vmax; right: -25vmax; top: -30vmax; background: radial-gradient(circle, var(--green), transparent 65%); }
  .orb.b { width: 60vmax; height: 60vmax; left: -25vmax; bottom: -30vmax; background: radial-gradient(circle, var(--blue), transparent 65%); animation-duration: 22s; }
  .ring {
    position: absolute; width: min(120vmin, 1100px); aspect-ratio: 1; left: 50%; top: 50%;
    border-radius: 50%; transform: translate(-50%, -50%);
    background: conic-gradient(from 0deg, transparent 0 8%, var(--green) 30%, var(--teal) 70%, transparent 92%);
    -webkit-mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1px));
            mask: radial-gradient(farthest-side, transparent calc(100% - 2px), #000 calc(100% - 1px));
    opacity: .5; animation: spin 40s linear infinite;
  }
  @keyframes float { to { transform: translate(-6vmax, 6vmax) scale(1.08); } }
  @keyframes spin { to { transform: translate(-50%, -50%) rotate(360deg); } }

  .panel { position: relative; width: 100%; max-width: 420px; text-align: center; animation: rise .9s var(--ease) both; }
  @keyframes rise { from { opacity: 0; transform: translateY(18px); } }
  .logo { width: 132px; margin: 0 auto 44px; color: #fff; }
  .logo svg { display: block; width: 100%; height: auto; }
  h1 { font: 600 30px/1.1 "Space Grotesk", "Segoe UI", sans-serif; letter-spacing: -.02em; margin: 0; }
  .sub { margin: 12px 0 0; color: rgba(255,255,255,.62); font-size: 15px; line-height: 1.5; }

  .dots { display: flex; justify-content: center; gap: 12px; margin: 34px 0 10px; }
  .dot {
    width: 14px; height: 14px; border-radius: 50%; border: 1.5px solid rgba(255,255,255,.35);
    transition: background .2s, border-color .2s, transform .25s var(--ease), box-shadow .2s;
  }
  .dot.on { background: var(--green); border-color: var(--green); transform: scale(1.15); box-shadow: 0 0 14px rgba(0,228,135,.7); }
  .dots.shake { animation: shake .45s; }
  .dots.ok .dot { background: var(--green); border-color: var(--green); }
  @keyframes shake { 20%,60% { transform: translateX(-10px); } 40%,80% { transform: translateX(10px); } }
  .msg { min-height: 22px; font-size: 14px; color: #ff8a8a; margin: 0 0 18px; }
  .msg.wait { color: rgba(255,255,255,.6); }

  .pad { display: grid; grid-template-columns: repeat(3, 1fr); gap: 14px; max-width: 300px; margin: 0 auto; }
  .key {
    height: 64px; border-radius: 20px; border: 1px solid rgba(255,255,255,.12);
    background: rgba(255,255,255,.05); color: #fff; cursor: pointer;
    font: 500 26px/1 "Space Grotesk", "Segoe UI", sans-serif;
    backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
    transition: background .2s, transform .15s, border-color .2s;
  }
  .key:hover { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.22); }
  .key:active, .key.press { transform: scale(.94); background: rgba(0,228,135,.22); border-color: var(--green); }
  .key.ghost { background: transparent; border-color: transparent; font: 500 14px/1 "Inter", sans-serif; color: rgba(255,255,255,.7); }
  .key:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

  .remember { display: inline-flex; align-items: center; gap: 10px; margin-top: 26px; font-size: 14px; color: rgba(255,255,255,.75); cursor: pointer; user-select: none; }
  .remember input { position: absolute; opacity: 0; pointer-events: none; }
  .switch { width: 38px; height: 22px; border-radius: 999px; background: rgba(255,255,255,.18); position: relative; transition: background .25s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; transition: transform .25s var(--ease); }
  .remember input:checked + .switch { background: var(--green); }
  .remember input:checked + .switch::after { transform: translateX(16px); }
  .remember input:focus-visible + .switch { outline: 2px solid var(--green); outline-offset: 2px; }
  .foot { margin-top: 34px; font-size: 12px; letter-spacing: .14em; text-transform: uppercase; color: rgba(255,255,255,.4); }

  #pin-input { position: absolute; opacity: 0; pointer-events: none; width: 1px; height: 1px; }
  .loading { position: fixed; inset: 0; display: grid; place-items: center; background: var(--ink); }
  .spinner { width: 34px; height: 34px; border-radius: 50%; border: 2px solid rgba(255,255,255,.15); border-top-color: var(--green); animation: sp 0.9s linear infinite; }
  @keyframes sp { to { transform: rotate(360deg); } }
  @media (max-height: 640px) { .logo { margin-bottom: 22px; } .key { height: 52px; } .dots { margin-top: 22px; } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
  #remotion-bg { position: absolute; inset: 0; opacity: 0; transition: opacity 1.2s; }
  #remotion-bg.on { opacity: 1; }
  #remotion-bg > div { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: center; }
  .bg.has-remotion .orb, .bg.has-remotion .ring { opacity: 0; transition: opacity 1.2s; }
